name: Release Gobrick
# Invocable as a reusable workflow
# Can be manually triggered
on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:
    inputs:
      option:
        description: "Select version to release"
        required: true
        type: choice
        default: "minor"
        options:
          - major
          - minor
          - patch
          # - "n-1/n-2 patch (Provide input in the below box)"
      version:
        description: "Patch version to release. example: 2.1.x (For n-1 and n-2 versions only)"
        required: false
        type: string
  repository_dispatch:
    types: [release-go-libs]
jobs:
  # This job is to update the commits of the dependent libraries for Gobrick library
  # package-update:
  #   uses: dell/common-github-actions/.github/workflows/update-libraries.yml@main
  #   name: Dell Libraries Update
  #   secrets: inherit
  csm-release:
    # needs: [package-update]
    uses: dell/common-github-actions/.github/workflows/csm-release-libs.yaml@bugfix/patch-release
    name: Release Go Client Libraries
    with:
      version: "${{ github.event.inputs.version != '' ? github.event.inputs.version : (github.event.inputs.option || 'minor') }}"
    secrets: inherit
